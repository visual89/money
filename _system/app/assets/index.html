<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>가계부</title>
<style>
:root { --bg:#FAF9F5; --side:#F0EEE6; --card:#FFFFFF; --text:#1F1E1D; --muted:#7A776F; --line:#DEDBD0;
  --accent:#C96442; --accent-h:#B5583A; --chip:#EDEAE0; --head:#F1EFE8; --sel:#E7E3D6;
  --in:#4F8A5B; --out:#B8493F; --warn:#C28A2B; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#262624; --side:#1F1E1D; --card:#30302E; --text:#F5F4EE; --muted:#A6A39A; --line:#3E3D39;
    --accent:#D97757; --accent-h:#E08A6D; --chip:#3A3936; --head:#3A3936; --sel:#45443F;
    --in:#7FB88A; --out:#E0867C; --warn:#D9A94E; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font-family:'맑은 고딕','Malgun Gothic',sans-serif; font-size:15px; line-height:1.5; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
#app { max-width:640px; margin:0 auto; min-height:100%; padding:0 14px 150px; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0 8px; display:flex; align-items:center; gap:6px; }
header .ttl { flex:1; text-align:center; font-size:1.15rem; font-weight:700; }
.nav { width:40px; height:40px; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:1rem; }
.today { border:1px solid var(--line); background:var(--card); border-radius:10px; height:40px; padding:0 12px; font-size:.85rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
.card h3 { margin:0 0 10px; font-size:.95rem; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0; }
.stat span { display:block; font-size:.75rem; color:var(--muted); }
.stat b { display:block; font-size:1rem; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.in { color:var(--in); } .out { color:var(--out); } .muted { color:var(--muted); } .small { font-size:.8rem; }
.bar { height:8px; background:var(--chip); border-radius:4px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); border-radius:4px; }
.bar.over i { background:var(--out); }
.search { width:100%; height:46px; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:0 16px; margin-bottom:12px; outline:none; }
.search:focus, .fld:focus { border-color:var(--accent); }
.day { display:flex; justify-content:space-between; align-items:baseline; padding:14px 4px 6px; font-size:.82rem; color:var(--muted); font-weight:600; }
.list { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.item { display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--line); }
.item:first-child { border-top:none; }
.item:active { background:var(--sel); }
.item .l { flex:1; min-width:0; }
.item .m { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .s { font-size:.76rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .a { font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tag { display:inline-block; background:var(--chip); border-radius:6px; padding:0 6px; font-size:.7rem; margin-right:4px; color:var(--text); }
.tag.auto { background:transparent; border:1px solid var(--accent); color:var(--accent); }
.empty { text-align:center; color:var(--muted); padding:36px 10px; }
.row { display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:.88rem; }
.row .n { width:6.2em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .bar { flex:1; }
.row .v { width:7.4em; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.row .p { width:3em; text-align:right; color:var(--muted); font-size:.75rem; }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
th, td { padding:8px 6px; text-align:right; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
th { background:var(--head); border-top:none; color:var(--muted); font-weight:600; }
th:first-child, td:first-child { text-align:left; }
.fab { position:fixed; right:18px; bottom:84px; width:58px; height:58px; border-radius:50%; border:none; background:var(--accent);
  color:#fff; font-size:1.9rem; line-height:1; z-index:6; box-shadow:0 2px 8px rgba(0,0,0,.18); }
.fab:active { background:var(--accent-h); }
nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--side); border-top:1px solid var(--line);
  display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom); }
nav.tabs button { flex:1; max-width:160px; height:60px; border:none; background:none; color:var(--muted); font-size:.82rem; }
nav.tabs button.on { color:var(--accent); font-weight:700; }
nav.tabs button b { display:block; font-size:1.15rem; font-weight:400; }
.shade { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10; display:none; align-items:flex-end; justify-content:center; }
.shade.on { display:flex; }
.sheet { background:var(--bg); width:100%; max-width:640px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px 22px; }
.sheet h2 { margin:0 0 12px; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; }
.x { border:none; background:none; font-size:1.3rem; color:var(--muted); padding:0 4px; }
.seg { display:flex; background:var(--chip); border-radius:10px; padding:3px; margin-bottom:12px; }
.seg button { flex:1; height:40px; border:none; background:none; border-radius:8px; color:var(--muted); }
.seg button.on { background:var(--card); color:var(--text); font-weight:700; }
label { display:block; font-size:.78rem; color:var(--muted); margin:10px 2px 4px; }
.fld { width:100%; height:46px; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:0 12px; outline:none; }
textarea.fld { height:96px; padding:10px 12px; resize:none; }
.amt { font-size:1.35rem; font-weight:700; text-align:right; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btns { display:flex; gap:8px; margin-top:16px; }
.btn { flex:1; height:48px; border-radius:10px; border:1px solid var(--line); background:var(--card); }
.btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
.btn.pri:active { background:var(--accent-h); }
.btn.del { flex:0 0 84px; color:var(--out); }
.btn.sm { flex:none; height:40px; padding:0 14px; font-size:.85rem; }
.raw { background:var(--head); border-radius:10px; padding:10px 12px; font-size:.78rem; white-space:pre-wrap; word-break:break-all; color:var(--muted); margin-top:12px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { background:var(--chip); border-radius:8px; padding:5px 6px 5px 10px; font-size:.85rem; display:flex; align-items:center; gap:2px; }
.chip button { border:none; background:none; color:var(--muted); font-size:1rem; padding:0 4px; }
.status { display:flex; align-items:center; gap:10px; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--out); flex:none; }
.dot.on { background:var(--in); }
#toast { position:fixed; left:50%; bottom:160px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px;
  border-radius:20px; font-size:.88rem; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; max-width:86%; text-align:center; }
#toast.on { opacity:.94; }
svg text { font-family:inherit; fill:var(--muted); font-size:10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="nav" id="prev" aria-label="이전">◀</button>
    <div class="ttl" id="ttl"></div>
    <button class="today" id="today">이번 달</button>
    <button class="nav" id="next" aria-label="다음">▶</button>
  </header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="내역 추가">+</button>
<nav class="tabs" id="tabs">
  <button data-t="list" class="on"><b>☰</b>내역</button>
  <button data-t="stat"><b>◔</b>통계</button>
  <button data-t="year"><b>▥</b>연간</button>
  <button data-t="set"><b>⚙</b>설정</button>
</nav>
<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
"use strict";
// ───────── PC 브라우저 미리 보기용 가짜 창구 (폰에서는 진짜 Android 창구가 있어 쓰이지 않는다) ─────────
if (!window.Android) window.Android = (() => {
  const t = new Date(), ym = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0");
  let seq = 1;
  const E = (d, time, kind, category, amount, method, memo, who, auto) =>
    ({ id: seq++, date: ym + "-" + String(d).padStart(2, "0"), time, kind, category, amount, method, memo, who, auto, source: auto ? "카드" : "", raw: auto ? "[○○카드] 승인\n" + amount.toLocaleString() + "원 일시불\n" + memo : "" });
  let rows = [E(1, "09:00", "in", "월급", 3200000, "계좌이체", "11월 급여", "남편", 0), E(2, "12:31", "out", "식비", 9500, "현대카드", "김밥천국 본점", "남편", 1),
    E(2, "19:05", "out", "생활용품", 32900, "우리카드", "쿠팡", "아내", 1), E(3, "08:12", "out", "카페·간식", 4700, "현대카드", "스타벅스 강남점", "남편", 1),
    E(5, "18:40", "out", "식비", 68400, "롯데카드", "이마트 평택점", "아내", 1), E(6, "10:00", "out", "교통", 55000, "카드", "GS칼텍스 주유소", "남편", 1),
    E(7, "", "out", "경조사", 100000, "현금", "결혼식 축의금", "남편", 0), E(7, "15:20", "out", "기타", 50000, "우리은행", "홍길동", "남편", 1), E(8, "21:15", "out", "미분류", 15000, "간편결제", "네이버페이", "아내", 1)];
  const J = JSON.stringify, cats = { out: ["식비", "카페·간식", "교통", "생활용품", "경조사", "기타", "미분류"], in: ["월급", "기타수입"] };
  let who = "남편";
  return {
    meta: () => J({ categories: cats, methods: ["카드", "현금", "계좌이체", "간편결제"], who, count: rows.length, noti: false, version: "미리 보기", sync_url: "", sync_key: "", sync_last: "", pending: 0 }),
    sync: () => J({ ok: true }), installUpdate: () => J({ ok: true }),
    checkUpdate: () => { setTimeout(() => onNativeUpdate({ version: "9.9", notes: "미리 보기용 예시", force: true }), 300); return J({ ok: true }); },
    month: m => J(rows.filter(r => r.date.startsWith(m)).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))),
    search: q => J(rows.filter(r => (r.memo + r.category).includes(q))),
    year: y => J({ year: y, months: Array.from({ length: 12 }, (_, i) => { const k = y + "-" + String(i + 1).padStart(2, "0"); const s = k2 => rows.filter(r => r.date.startsWith(k) && r.kind === k2).reduce((a, r) => a + r.amount, 0); return { ym: k, in: s("in"), out: s("out") }; }), categories: [] }),
    save: j => { const b = JSON.parse(j); b.amount = +String(b.amount).replace(/,/g, ""); if (!b.amount) return J({ error: "금액을 알 수 없습니다" }); if (b.id) Object.assign(rows.find(r => r.id === b.id), b); else rows.push({ ...b, id: seq++, time: "", who, auto: 0, raw: "" }); return J({ ok: true }); },
    remove: id => { rows = rows.filter(r => r.id !== +id); return J({ ok: true }); },
    suggest: memo => { const k = memo.replace(/\s/g, ""), r = k.length >= 3 && rows.find(x => x.kind === "out" && x.category !== "미분류" && x.memo.replace(/\s/g, "").startsWith(k.slice(0, 4))); return J({ category: r ? r.category : "" }); },
    category: (k, n, a) => { if (a === "add") cats[k].push(n); else cats[k] = cats[k].filter(x => x !== n); return J({ ok: true }); },
    setSetting: (k, v) => { if (k === "who") who = v; return J({ ok: true }); },
    openNotiSettings: () => J({ ok: true }), openAppInfo: () => J({ ok: true }), exportCsv: () => J({ ok: true }), importCsv: () => J({ ok: true }),
  };
})();

// ───────── 공통 ─────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = n => Number(n || 0).toLocaleString("ko-KR");
const pad = n => String(n).padStart(2, "0");
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function call(name, ...args) {
  const r = JSON.parse(Android[name](...args));
  if (r && r.error) throw new Error(r.error);
  return r;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}
function safe(fn) {
  return (...a) => { try { return fn(...a); } catch (e) { toast(e.message || String(e)); } };
}
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };

const S = { update: null, tab: "list", ym: todayStr().slice(0, 7), year: todayStr().slice(0, 4), meta: null, entries: [], q: "", form: null };

// ───────── 그리기 ─────────
function load() {
  S.meta = call("meta");
  if (S.tab === "list" || S.tab === "stat") S.entries = S.q && S.tab === "list" ? call("search", S.q) : call("month", S.ym);
  render();
}
function sums(list) {
  let i = 0, o = 0;
  for (const e of list) e.kind === "in" ? i += e.amount : o += e.amount;
  return { in: i, out: o };
}
function render() {
  const monthly = S.tab === "list" || S.tab === "stat";
  $("#ttl").textContent = S.tab === "set" ? "설정" : S.tab === "year" ? S.year + "년" : S.ym.slice(0, 4) + "년 " + (+S.ym.slice(5)) + "월";
  for (const id of ["prev", "next", "today"]) $("#" + id).style.visibility = S.tab === "set" ? "hidden" : "visible";
  $("#today").textContent = S.tab === "year" ? "올해" : "이번 달";
  $("#fab").style.display = monthly ? "" : "none";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === S.tab));
  const upd = S.update ? `<div class="card" style="border-color:var(--accent)"><div class="status"><div style="flex:1"><b>새 버전 ${esc(S.update.version)}이 나왔습니다</b>
    <div class="small muted">${esc(S.update.notes || "")}</div></div><button class="btn pri sm" data-act="update">업데이트</button></div></div>` : "";
  // 설정 탭에서는 [업데이트]를 맨 아래 '앱 업데이트' 칸 안에 보여 준다 ([업데이트 확인] 단추 바로 아래)
  $("#main").innerHTML = (S.tab === "set" ? "" : upd) + { list: viewList, stat: viewStat, year: viewYear, set: viewSet }[S.tab]();
}
function statsHtml(s) {
  return `<div class="stats">
    <div class="stat"><span>지출</span><b class="out">${won(s.out)}</b></div>
    <div class="stat"><span>수입</span><b class="in">${won(s.in)}</b></div>
    <div class="stat"><span>남은 돈</span><b>${won(s.in - s.out)}</b></div></div>`;
}
function itemHtml(e, showDate) {
  const sub = [showDate ? e.date.slice(5).replace("-", ".") : "", e.time, e.method].filter(Boolean).join(" · ");
  return `<div class="item" data-id="${e.id}"><div class="l">
    <div class="m">${esc(e.memo || e.category || "(내용 없음)")}</div>
    <div class="s">${e.category ? `<span class="tag">${esc(e.category)}</span>` : ""}${e.who ? `<span class="tag">${esc(e.who)}</span>` : ""}${e.auto ? '<span class="tag auto">자동</span>' : ""}${esc(sub)}</div>
    </div><div class="a ${e.kind}">${e.kind === "in" ? "+" : "-"}${won(e.amount)}</div></div>`;
}
function viewList() {
  const s = sums(S.entries);
  let h = S.q ? "" : statsHtml(s);
  h += `<input class="search" id="q" placeholder="전체 기간에서 찾기 (가게·분류·사람)" value="${esc(S.q)}">`;
  if (S.q) h += `<div class="small muted" style="margin:0 4px 4px">전체 기간 검색 ${S.entries.length}건 · 지출 ${won(s.out)}원 · 수입 ${won(s.in)}원</div>`;
  if (!S.entries.length) return h + `<div class="empty">${S.q ? "찾는 내역이 없습니다." : "이 달에 적힌 내역이 없습니다.<br>결제 알림이 오면 자동으로 적히고,<br>아래 + 버튼으로 직접 적을 수도 있습니다."}</div>`;
  const days = new Map();
  for (const e of S.entries) (days.get(e.date) || days.set(e.date, []).get(e.date)).push(e);
  for (const [d, list] of days) {
    const ds = sums(list), dt = new Date(d + "T00:00:00");
    h += `<div class="day"><span>${S.q ? d.slice(0, 4) + "년 " : ""}${+d.slice(5, 7)}월 ${+d.slice(8)}일 (${WD[dt.getDay()]})</span><span>${ds.out ? "-" + won(ds.out) : ""}${ds.in ? "　+" + won(ds.in) : ""}</span></div>
      <div class="list">${list.map(e => itemHtml(e, false)).join("")}</div>`;
  }
  return h;
}
function rowsHtml(pairs, total, cls) {
  const max = Math.max(1, ...pairs.map(p => p[1]));
  return pairs.map(([n, v]) => `<div class="row"><span class="n">${esc(n)}</span><div class="bar"><i style="width:${Math.round(v / max * 100)}%"></i></div>
    <span class="v ${cls || ""}">${won(v)}</span><span class="p">${total ? (v / total * 100).toFixed(1) : "0.0"}%</span></div>`).join("") || '<div class="muted small">내역이 없습니다.</div>';
}
function groupBy(list, key) {
  const m = new Map();
  for (const e of list) m.set(e[key] || "(없음)", (m.get(e[key] || "(없음)") || 0) + e.amount);
  return [...m].sort((a, b) => b[1] - a[1]);
}
function viewStat() {
  const s = sums(S.entries), outs = S.entries.filter(e => e.kind === "out");
  const top = groupBy(outs, "memo").slice(0, 10);
  return statsHtml(s)
    + `<div class="card"><h3>분류별 지출</h3>${rowsHtml(groupBy(outs, "category"), s.out)}</div>`
    + `<div class="card"><h3>사람별 지출</h3>${rowsHtml(groupBy(outs, "who"), s.out)}</div>`
    + `<div class="card"><h3>결제수단별 지출</h3>${rowsHtml(groupBy(outs, "method"), s.out)}</div>`
    + `<div class="card"><h3>많이 쓴 곳 (상위 10곳)</h3>${rowsHtml(top, s.out)}</div>`;
}
function viewYear() {
  const y = call("year", S.year), ms = y.months;
  const t = ms.reduce((a, m) => ({ in: a.in + m.in, out: a.out + m.out }), { in: 0, out: 0 });
  const max = Math.max(1, ...ms.map(m => Math.max(m.in, m.out))), W = 600, H = 190, bw = 15;
  let bars = "";
  ms.forEach((m, i) => {
    const x = 14 + i * (W - 20) / 12, hi = m.in / max * (H - 30), ho = m.out / max * (H - 30);
    bars += `<rect x="${x}" y="${H - 18 - hi}" width="${bw}" height="${hi}" rx="2" fill="var(--in)"/>
      <rect x="${x + bw + 2}" y="${H - 18 - ho}" width="${bw}" height="${ho}" rx="2" fill="var(--out)"/>
      <text x="${x + bw + 1}" y="${H - 4}" text-anchor="middle">${i + 1}월</text>`;
  });
  const cats = y.categories || [];
  return statsHtml(t)
    + `<div class="card"><h3>월별 수입·지출 <span class="small muted" style="font-weight:400">　<span class="in">■</span> 수입　<span class="out">■</span> 지출</span></h3>
      <svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="8" x2="${W - 4}" y1="${H - 18}" y2="${H - 18}" stroke="var(--line)"/>${bars}</svg></div>`
    + `<div class="card" style="padding:6px 8px"><table><thead><tr><th>월</th><th>수입</th><th>지출</th><th>남은 돈</th></tr></thead><tbody>
      ${ms.map(m => `<tr data-ym="${m.ym}"><td>${+m.ym.slice(5)}월</td><td class="in">${won(m.in)}</td><td class="out">${won(m.out)}</td><td>${won(m.in - m.out)}</td></tr>`).join("")}
      <tr><td><b>합계</b></td><td class="in"><b>${won(t.in)}</b></td><td class="out"><b>${won(t.out)}</b></td><td><b>${won(t.in - t.out)}</b></td></tr></tbody></table></div>`
    + (cats.length ? `<div class="card"><h3>분류별 지출 (연간)</h3>${rowsHtml(cats, t.out)}</div>` : "");
}
function viewSet() {
  const m = S.meta;
  const chips = k => m.categories[k].map(n => `<span class="chip">${esc(n)}<button data-catdel="${k}" data-name="${esc(n)}" aria-label="삭제">×</button></span>`).join("");
  return `<div class="card"><h3>결제 알림 자동 기록</h3>
      <div class="status"><span class="dot ${m.noti ? "on" : ""}"></span><div style="flex:1"><b>${m.noti ? "켜짐" : "꺼짐"}</b>
        <div class="small muted">${m.noti ? "모든 앱·문자의 결제·입출금 알림을 읽어 자동으로 적습니다. 같은 결제를 문자와 앱이 함께 알리면 한 번만 적습니다." : "'알림 접근'에서 가계부를 켜야 결제 알림이 자동으로 적힙니다."}</div></div></div>
      <div class="small muted" style="margin-top:8px">알림 수신: ${m.noti_seen ? "마지막으로 알림이 들어온 때 " + esc(m.noti_seen) : (m.noti_connected ? "연결됨 (" + esc(m.noti_connected) + ") · 아직 들어온 알림 없음" : "아직 연결된 적 없음")}</div>
      <div class="btns"><button class="btn ${m.noti ? "" : "pri"}" data-act="noti">알림 접근 설정 열기</button><button class="btn" data-act="appinfo">앱 정보</button></div>
      <div class="small muted" style="margin-top:8px">켜지지 않고 회색으로 막혀 있으면: [앱 정보] → 오른쪽 위 ⋮ → '제한된 설정 허용'을 누른 뒤 다시 켭니다.</div></div>
    <div class="card"><h3>구글 스프레드시트 공유</h3>
      <div class="status"><span class="dot ${m.sync_url ? "on" : ""}"></span><div style="flex:1"><b>${m.sync_url ? "연결됨" : "연결 안 됨"}</b>
        <div class="small muted">${m.sync_url ? esc(m.sync_last || "아직 맞춘 적 없음") + (m.pending ? " · 올릴 내역 " + won(m.pending) + "건" : "") : "두 폰에 같은 주소와 암호를 넣으면 내역이 한 장부로 합쳐집니다."}</div></div></div>
      <label>웹 앱 주소 (https://script.google.com/macros/s/…/exec)</label><input class="fld" id="sync-url" value="${esc(m.sync_url)}" placeholder="설치 안내서의 3단계에서 복사한 주소" autocapitalize="off" autocomplete="off">
      <label>암호 (시트 스크립트에 적은 것과 같게)</label><input class="fld" id="sync-key" value="${esc(m.sync_key)}" maxlength="60" autocapitalize="off" autocomplete="off">
      <div class="btns"><button class="btn" data-act="sync-save">저장</button><button class="btn ${m.sync_url ? "pri" : ""}" data-act="sync-now">지금 맞추기</button></div></div>
    <div class="card"><h3>내 이름</h3><div class="small muted" style="margin-bottom:8px">이 폰에서 적히는 내역에 붙는 이름입니다 (예: 남편, 아내).</div>
      <div style="display:flex;gap:8px"><input class="fld" id="who" maxlength="10" value="${esc(m.who)}" placeholder="이름"><button class="btn sm" data-act="who">저장</button></div></div>
    <div class="card"><h3>분류 관리</h3><div class="small muted" style="margin-bottom:8px">내역을 눌러 분류를 바꾸면 그 가게를 기억해, 다음부터 같은 곳·비슷한 이름(다른 지점 등)은 자동으로 그 분류로 적힙니다. 분류를 추가·삭제하면 시트로 공유하는 상대 폰의 분류 목록도 똑같이 바뀝니다.</div><label>지출</label><div class="chips">${chips("out")}</div>
      <div style="display:flex;gap:8px;margin-top:8px"><input class="fld" id="cat-out" maxlength="30" placeholder="새 지출 분류"><button class="btn sm" data-catadd="out">추가</button></div>
      <label>수입</label><div class="chips">${chips("in")}</div>
      <div style="display:flex;gap:8px;margin-top:8px"><input class="fld" id="cat-in" maxlength="30" placeholder="새 수입 분류"><button class="btn sm" data-catadd="in">추가</button></div></div>
    <div class="card"><h3>내보내기 · 가져오기 (보관용)</h3>
      <div class="small muted">내역을 CSV 파일로 저장하거나 다시 넣습니다. 엑셀에서도 열립니다. 가져올 때 이미 있는 내역은 건너뜁니다.</div>
      <div class="btns"><button class="btn" data-act="exp-month">이번 달 내보내기</button><button class="btn" data-act="exp-all">전체 내보내기</button></div>
      <div class="btns" style="margin-top:8px"><button class="btn" data-act="imp">가져오기</button></div></div>
    <div class="card"><h3>앱 업데이트</h3><div class="status"><div style="flex:1"><b>지금 버전 ${esc(m.version || "")}</b>
      <div class="small muted">앱을 열 때 새 버전을 자동으로 확인하고, 있으면 [업데이트] 버튼이 뜹니다 (이 화면에서는 바로 아래).</div></div><button class="btn sm" data-act="upd-check">업데이트 확인</button></div>
      ${S.update ? `<div class="status" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><div style="flex:1"><b>새 버전 ${esc(S.update.version)}이 나왔습니다</b>
        <div class="small muted">${esc(S.update.notes || "")}</div></div><button class="btn pri sm" data-act="update">업데이트</button></div>` : ""}</div>
    <div class="small muted" style="text-align:center">가계부 ${esc(m.version || "")} · 내역 ${won(m.count)}건 · ${m.sync_url ? "자료는 이 폰과 내 구글 시트에 저장됩니다" : "자료는 이 폰 안에만 저장됩니다"}</div>`;
}

// ───────── 입력 창 ─────────
// 결제수단은 '현대카드'·'우리은행'처럼 카드사·은행 이름으로 적힌다. 입력 창에서는 묶음 단추 + 이름 칸으로 나눠 보여 준다
function methodGroup(m) {
  if (!m || S.meta.methods.includes(m)) return m || "카드";
  return /카드/.test(m) ? "카드" : /페이|pay/i.test(m) ? "간편결제" : "계좌이체";
}
function formMethod(f) {
  let n = (f.issuer || "").trim();
  if (!n || (f.group !== "카드" && f.group !== "계좌이체")) return f.group;
  if (f.group === "카드" && !n.includes("카드")) n += "카드";
  return n.slice(0, 20);
}
function openForm(e) {
  S.form = e ? { ...e } : { id: 0, kind: "out", date: S.ym === todayStr().slice(0, 7) ? todayStr() : S.ym + "-01", amount: "", category: "", method: "카드", memo: "", raw: "" };
  S.form.group = methodGroup(S.form.method);
  S.form.issuer = S.form.method === S.form.group ? "" : S.form.method;
  drawForm();
  $("#shade").classList.add("on");
  if (!e) setTimeout(() => $("#f-amt") && $("#f-amt").focus(), 80);
}
// 받은 알림 원본. 같은 결제를 여러 앱이 알려 합쳐진 내역은 알림마다 칸을 따로 보여 준다
function rawHtml(raw) {
  const l = (raw || "").split(/\n\n(?=\[)/).filter(x => x.trim());
  return l.map((x, i) => `<div class="raw">받은 알림${l.length > 1 ? ` ${i + 1} / ${l.length}` : ""}\n${esc(x)}</div>`).join("");
}
function drawForm() {
  const f = S.form, cats = [...S.meta.categories[f.kind]];
  if (f.category && !cats.includes(f.category)) cats.unshift(f.category);
  $("#sheet").innerHTML = `<h2>${f.id ? "내역 고치기" : "내역 적기"}<button class="x" data-act="close" aria-label="닫기">✕</button></h2>
    <div class="seg"><button data-kind="out" class="${f.kind === "out" ? "on" : ""}">지출</button><button data-kind="in" class="${f.kind === "in" ? "on" : ""}">수입</button></div>
    <label>금액 (원)</label><input class="fld amt" id="f-amt" inputmode="numeric" placeholder="0" value="${f.amount ? won(String(f.amount).replace(/,/g, "")) : ""}">
    <label>${f.kind === "out" ? "어디에 썼나요" : "내용"}</label><input class="fld" id="f-memo" maxlength="100" value="${esc(f.memo)}" placeholder="${f.kind === "out" ? "가게 이름 · 내용" : "예) 11월 급여"}">
    <div class="two"><div><label>날짜</label><input class="fld" id="f-date" type="date" value="${esc(f.date)}"></div>
      <div><label>분류</label><select class="fld" id="f-cat">${cats.map(c => `<option ${c === f.category ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div></div>
    <label>결제수단</label><div class="seg" id="f-method" style="margin-bottom:0">${S.meta.methods.map(x => `<button data-method="${esc(x)}" class="${x === f.group ? "on" : ""}">${esc(x)}</button>`).join("")}</div>
    ${f.group === "카드" || f.group === "계좌이체" ? `<input class="fld" id="f-issuer" maxlength="20" style="margin-top:8px" value="${esc(f.issuer)}" placeholder="${f.group === "카드" ? "카드사 이름 (예: 현대카드) · 비우면 '카드'" : "은행 이름 (예: 우리은행) · 비우면 '계좌이체'"}">` : ""}
    ${rawHtml(f.raw)}
    <div class="btns">${f.id ? '<button class="btn del" data-act="del">삭제</button>' : ""}<button class="btn" data-act="close">취소</button><button class="btn pri" data-act="save">저장</button></div>`;
}
function readForm() {
  const f = S.form;
  f.amount = $("#f-amt").value;
  f.memo = $("#f-memo").value;
  f.date = $("#f-date").value;
  f.category = $("#f-cat").value;
  if ($("#f-issuer")) f.issuer = $("#f-issuer").value;
}
function closeForm() {
  $("#shade").classList.remove("on");
  S.form = null;
}

// ───────── 동작 ─────────
function shift(n) {
  if (S.tab === "year") S.year = String(+S.year + n);
  else {
    const d = new Date(+S.ym.slice(0, 4), +S.ym.slice(5) - 1 + n, 1);
    S.ym = d.getFullYear() + "-" + pad(d.getMonth() + 1);
    S.q = "";
  }
  load();
}
$("#prev").onclick = safe(() => shift(-1));
$("#next").onclick = safe(() => shift(1));
$("#today").onclick = safe(() => { S.ym = todayStr().slice(0, 7); S.year = todayStr().slice(0, 4); S.q = ""; load(); });
$("#fab").onclick = safe(() => openForm(null));
$("#tabs").onclick = safe(ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  S.tab = b.dataset.t;
  S.q = "";
  window.scrollTo(0, 0);
  load();
});
$("#shade").onclick = ev => { if (ev.target.id === "shade") closeForm(); };

let qTimer;
$("#main").addEventListener("input", ev => {
  if (ev.target.id === "q") {
    clearTimeout(qTimer);
    qTimer = setTimeout(safe(() => {
      S.q = $("#q").value.trim();
      const pos = $("#q").selectionStart;
      load();
      const q = $("#q");
      q.focus();
      q.setSelectionRange(pos, pos);
    }), 300);
  }
});
$("#main").addEventListener("click", safe(ev => {
  const item = ev.target.closest(".item"), tr = ev.target.closest("tr[data-ym]"), b = ev.target.closest("button");
  if (item) return openForm(S.entries.find(e => e.id === +item.dataset.id));
  if (tr) { S.ym = tr.dataset.ym; S.tab = "list"; window.scrollTo(0, 0); return load(); }
  if (!b) return;
  if (b.dataset.catadd) {
    const k = b.dataset.catadd, name = $("#cat-" + k).value.trim();
    if (!name) return toast("분류 이름을 입력해 주세요");
    call("category", k, name, "add");
    call("sync");
    return load();
  }
  if (b.dataset.catdel) { call("category", b.dataset.catdel, b.dataset.name, "delete"); call("sync"); return load(); }
  const act = b.dataset.act;
  if (act === "update") call("installUpdate");
  else if (act === "upd-check") { toast("새 버전을 확인하는 중…"); call("checkUpdate"); }
  else if (act === "noti") call("openNotiSettings");
  else if (act === "appinfo") call("openAppInfo");
  else if (act === "who") { call("setSetting", "who", $("#who").value.trim()); toast("이름을 저장했습니다"); load(); }
  else if (act === "sync-save" || act === "sync-now") {
    if (act === "sync-save" || $("#sync-url").value.trim() !== S.meta.sync_url || $("#sync-key").value.trim() !== S.meta.sync_key) {
      call("setSetting", "sync_url", $("#sync-url").value.trim());
      call("setSetting", "sync_key", $("#sync-key").value.trim());
    }
    if (!$("#sync-url").value.trim()) { toast("주소를 지웠습니다 (공유 끔)"); return load(); }
    toast("시트와 맞추는 중…");
    call("sync");
  }
  else if (act === "exp-month") call("exportCsv", S.ym);
  else if (act === "exp-all") call("exportCsv", "all");
  else if (act === "imp") call("importCsv");
}));
let sugTimer;
$("#sheet").addEventListener("input", ev => {
  if (ev.target.id === "f-amt") {
    const v = ev.target.value.replace(/[^\d]/g, "").slice(0, 11);
    ev.target.value = v ? won(v) : "";
  } else if (ev.target.id === "f-memo") {
    // 새 지출을 적을 때: 전에 내역에서 분류를 정해 둔 곳(같거나 비슷한 이름)이면 그 분류를 미리 골라 준다. 직접 고른 분류는 건드리지 않는다
    clearTimeout(sugTimer);
    sugTimer = setTimeout(safe(() => {
      const f = S.form, sel = $("#f-cat");
      if (!f || f.id || f.kind !== "out" || f.catTouched || !sel) return;
      const c = call("suggest", $("#f-memo").value.trim()).category;
      if (!c) return;
      if (![...sel.options].some(o => o.value === c)) sel.add(new Option(c, c), 0);
      sel.value = c;
    }), 250);
  }
});
$("#sheet").addEventListener("change", ev => { if (ev.target.id === "f-cat" && S.form) S.form.catTouched = true; });
let delArmed = false;
$("#sheet").addEventListener("click", safe(ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.kind) { readForm(); S.form.kind = b.dataset.kind; S.form.category = ""; return drawForm(); }
  if (b.dataset.method) { readForm(); if (S.form.group !== b.dataset.method) { S.form.group = b.dataset.method; S.form.issuer = ""; } return drawForm(); }
  const act = b.dataset.act;
  if (act === "close") return closeForm();
  if (act === "del") {
    if (!delArmed) { delArmed = true; b.textContent = "정말 삭제"; setTimeout(() => { delArmed = false; if (b.isConnected) b.textContent = "삭제"; }, 3000); return; }
    delArmed = false;
    call("remove", String(S.form.id));
    closeForm();
    toast("삭제했습니다");
    call("sync");
    return load();
  }
  if (act === "save") {
    readForm();
    const f = S.form;
    if (!String(f.amount).replace(/[^\d]/g, "")) return toast("금액을 입력해 주세요");
    if (!f.date) return toast("날짜를 골라 주세요");
    call("save", JSON.stringify({ id: f.id || 0, kind: f.kind, date: f.date, amount: String(f.amount), category: f.category, method: formMethod(f), memo: f.memo }));
    S.ym = f.date.slice(0, 7);
    S.q = "";
    closeForm();
    toast("저장했습니다");
    call("sync");
    load();
  }
}));

// ───────── 안드로이드 쪽에서 부르는 함수 ─────────
window.onNativeBack = () => { if (S.form) { closeForm(); return true; } if (S.q) { S.q = ""; load(); return true; } if (S.tab !== "list") { S.tab = "list"; load(); return true; } return false; };
window.onNativeResume = safe(() => { if (!S.form) load(); });
// 구글 시트와 맞추기가 끝났을 때: 입력 중이거나 설정 칸에 글을 쓰는 중이면 화면을 건드리지 않는다
window.onNativeSync = safe(() => {
  const a = document.activeElement;
  if (S.form || (a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) return;
  load();
});
window.onNativeResult = r => { toast(r.error || r.message || ""); if (r.errors && r.errors.length) console.log(r.errors.join("\n")); if (!r.quiet) safe(load)(); };
// 업데이트 확인 결과: 새 판이 있으면 맨 위에 [업데이트] 카드를 띄운다. 직접 누른 확인(force)일 때만 '최신입니다'·실패를 알린다
window.onNativeUpdate = safe(r => {
  const had = !!S.update;
  S.update = r.version ? r : (r.error ? S.update : null);
  if (r.force) toast(r.error || (r.version ? "새 버전 " + r.version + "이 있습니다" : "최신 버전입니다"));
  const a = document.activeElement;
  if (had !== !!S.update && !S.form && !(a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) render();
});

safe(load)();
</script>
</body>
</html>
